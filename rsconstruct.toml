# rsconstruct configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.python]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.requirements]
src_dirs = ["src", "scripts"]
exclude = ["download", "imap"]
# `from ruamel.yaml import ...` scans as the top-level name `ruamel`, which is
# not the distribution name.
mapping = { ruamel = "ruamel.yaml", progressbar = "progressbar2" }

# ─── toml ────────────────────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── dependencies ────────────────────────────────────────────────────────────

# Runtime deps so CI installs what the code imports (pylint/mypy resolve them).
[dependencies]
pip = [
    "chardet",
    "python-dateutil",
    "PyGithub",
    "jsonschema",
    "python-pptx",
    "progressbar2",
    "pytz",
    "referencing",
    "requests",
    "types-requests",
    "ruamel.yaml",
    "pyyaml",
    "types-PyYAML",
    "types-python-dateutil",
    "types-jsonschema",
    "types-pytz",
    "bsddb3",
    "secretstorage",
]

# pyproject.toml is generated from the [dependencies] table above so that
# `uv sync` and CI install the same list. Never edit pyproject.toml by hand.
[processor.script.gen_pyproject]
command = "scripts/gen_pyproject.py"
src_files = ["rsconstruct.toml"]
batch = true
