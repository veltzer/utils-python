# rsconstruct configuration for this repository.

[build]
# src_dirs entries name directories; "." (the whole tree) is a config error
reject_dot_src_dirs = true

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.python]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.checker.ruff]
src_dirs = ["src", "scripts"]


[processor.checker.mypy]
src_dirs = ["src", "scripts"]

# ─── toml ────────────────────────────────────────────────────────────────────

[processor.checker.taplo]
src_files = [".rumdl.toml", "pyproject.toml", "rsconstruct.toml"]

# ─── dependencies ────────────────────────────────────────────────────────────

# Python dependencies come from pyproject.toml ([project].dependencies and
# [dependency-groups]); `rsconstruct tool install-deps` reads both.

# lint the GitHub Actions workflow files with actionlint
[processor.checker.iactionlint]
src_dirs = [".github/workflows"]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.checker.rumdl]
src_files = ["README.md"]

# ─── tests ───────────────────────────────────────────────────────────────────

# The smoke test (tests/test_smoke.py): the packages under src import, the
# scripts parse and share one shebang, and everything they import resolves.
# It checks the whole layout itself, so the file paths rsconstruct appends
# are ignored; scanning src, scripts and tests reruns it when any changes.
[processor.checker.script]
command = "python"
args = ["tests/test_smoke.py"]
src_dirs = ["src", "scripts", "tests"]
src_extensions = [".py"]
