# rsconstruct configuration for this repository.

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.python]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

# ─── toml ────────────────────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

# ─── dependencies ────────────────────────────────────────────────────────────

# Python dependencies come from pyproject.toml ([project].dependencies and
# [dependency-groups]); `rsconstruct tools install-deps` reads both.
[dependencies]
# bsddb3 has no wheel: pip builds it from the sdist, and that build needs the
# Berkeley DB headers (db.h, from libdb-dev). Without them CI dies in
# `setup.py egg_info` with metadata-generation-failed. System packages are
# installed before pip, so the headers are in place when bsddb3 compiles.
system = [
    "libdb-dev",
]

# pyproject.toml is generated from the [dependencies] table above so that
# `uv sync` and CI install the same list. Never edit pyproject.toml by hand.
[processor.script.gen_pyproject]
command = "scripts/gen_pyproject.py"
src_files = ["rsconstruct.toml"]
batch = true

# lint the GitHub Actions workflow files with actionlint
[processor.actionlint]
src_dirs = [".github/workflows"]
# actionlint 1.7.12's runner-label list predates the official ubuntu-26.04
# hosted runner; drop this ignore once a newer actionlint knows the label
args = ["-ignore", 'label "ubuntu-26\.04" is unknown']
