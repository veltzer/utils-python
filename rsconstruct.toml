# rsconstruct configuration for this repository — shared defaults plus
# repo-specific config (merged from the former rsconstruct.local.toml).

# ─── analyzers ───────────────────────────────────────────────────────────────

[analyzer.tera]

[analyzer.markdown]

[analyzer.python]

# ─── templating ──────────────────────────────────────────────────────────────

# Convention: tera configs are Lua (config/*.lua). dep_auto entries are
# silently skipped where absent. Repos still on config/*.py keep a
# dep_inputs override in their local overlay until converted.
[processor.tera]
dep_auto = [
	"config/project.lua",
	"config/personal.lua",
	"config/version.lua",
	"config/github.lua",
	"config/python.lua",
	"config/shared.lua",
]

# ─── markdown ────────────────────────────────────────────────────────────────

[processor.rumdl]
src_dirs = ["src"]

[processor.zspell]
src_dirs = ["src"]

# ─── python ──────────────────────────────────────────────────────────────────

[processor.ruff]
src_dirs = ["src", "scripts"]

[processor.pylint]
src_dirs = ["src", "scripts"]

[processor.mypy]
src_dirs = ["src", "scripts"]

[processor.requirements]
src_dirs = ["src", "scripts"]
exclude = ["download", "imap"]
# `from ruamel.yaml import ...` scans as the top-level name `ruamel`, which is
# not the distribution name.
mapping = { ruamel = "ruamel.yaml", progressbar = "progressbar2" }

# ─── shell ───────────────────────────────────────────────────────────────────

[processor.shellcheck]
src_dirs = ["scripts", "src"]
args = ["--severity=error", "--shell=bash"]

# ─── toml / yaml / json ──────────────────────────────────────────────────────

[processor.taplo]
src_dirs = ["."]

[processor.htmlhint]
src_dirs = ["src"]

[processor.tidy]
src_dirs = ["src"]

# ─── merged from rsconstruct.local.toml ─────────────────────────────────────

# Runtime deps so CI installs what the code imports (pylint/mypy resolve
# them) -- the demos-cloud-aws pattern.
[dependencies]
pip = [
    "chardet",
    "python-dateutil",
    "PyGithub",
    "jsonschema",
    "python-pptx",
    "progressbar2",
    "pytz",
    "referencing",
    "requests",
    "types-requests",
    "ruamel.yaml",
    "pyyaml",
    "types-PyYAML",
    "types-python-dateutil",
    "types-jsonschema",
    "types-pytz",
    "bsddb3",
    "secretstorage",
]

# pyproject.toml is generated from the [dependencies] table above so that
# `uv sync` and CI install the same list. Never edit pyproject.toml by hand.
[processor.script.gen_pyproject]
command = "scripts/gen_pyproject.py"
src_files = ["rsconstruct.local.toml"]
batch = true
