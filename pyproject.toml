# Single source of truth for this repo's Python dependencies: both `uv sync`
# and rsconstruct's `tools install-deps` read [project].dependencies (and
# [dependency-groups]) from here.
#
# This repo is not a distribution: it is standalone scripts under src/, plus
# local support packages that sit beside them. There is nothing to build a
# wheel from, hence `package = false` and no [build-system] table. The
# [project] table exists only because uv requires name, version and
# requires-python to resolve.


[project]
name = "utils-python"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "chardet",
    "google-api-python-client",
    "mutagen",
    "PyMySQL",
    "python-dateutil",
    "jsonschema",
    "python-pptx",
    "progressbar2",
    "pytz",
    "referencing",
    "requests",
    "ruamel.yaml",
    "pyyaml",
    "secretstorage",
    "google-auth",
]

[dependency-groups]
dev = [
    "pyrefly",
    "pytest",
    "ruff",
    "types-jsonschema",
    "types-pymysql",
    "types-python-dateutil",
    "types-pytz",
    "types-PyYAML",
    "types-requests",
]

[tool.uv]
package = false

[tool.pyrefly]
# Type checking (rsconstruct's pyrefly processor), with pyrefly's default
# error set. "." on the search path is mypy's implicit current directory.
# Warnings fail the check like errors (pyrefly lets them pass by default).
min-severity = "warn"
search-path = [
    "src",
    "scripts",
    "tests",
    ".",
]

[tool.pyrefly.errors]
implicit-any-attribute = "error"
implicit-any-empty-container = "error"
implicit-any-lambda = "error"
implicit-any-type-argument = "error"
instance-var-assign = "error"
method-assign = "error"
missing-override-decorator = "error"
no-any-return = "error"
possibly-uninitialized-attribute = "error"
