# Single source of truth for this repo's Python dependencies: both `uv sync`
# and rsconstruct's `tools install-deps` read [project].dependencies (and
# [dependency-groups]) from here.
#
# This repo is not a distribution: it is standalone scripts under src/, plus
# local support packages that sit beside them. There is nothing to build a
# wheel from, hence `package = false` and no [build-system] table. The
# [project] table exists only because uv requires name, version and
# requires-python to resolve.


[project]
name = "utils-python"
version = "0.0.0"
requires-python = ">=3.14"
dependencies = [
    "chardet",
    "python-dateutil",
    "PyGithub",
    "jsonschema",
    "python-pptx",
    "progressbar2",
    "pytz",
    "referencing",
    "requests",
    "types-requests",
    "ruamel.yaml",
    "pyyaml",
    "types-PyYAML",
    "types-python-dateutil",
    "types-jsonschema",
    "types-pytz",
    "bsddb3",
    "secretstorage",
]

[dependency-groups]
dev = [
    "mypy",
    "pylint",
    "pytest",
    "ruff",
]

[tool.uv]
package = false

[tool.mypy]
mypy_path = "src:python:scripts"
explicit_package_bases = true
namespace_packages = true

# Third-party libraries without type stubs; `foo.*` also matches `foo` itself.
[[tool.mypy.overrides]]
module = [
    "download.*",
    "jsonschema.*",
    "pptx.*",
    "progressbar.*",
    "ruamel.*",
    "secretstorage.*",
]
ignore_missing_imports = true
